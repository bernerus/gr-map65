repo: # Put the URL of the repository here
website:
description: |-
  A UDP sink that sends complex I/Q as Linrad timf2 network packets, the
  format read by the wideband EME receivers MAP65, EME65 (WS suite) and QMAP.
  Supports single and dual polarisation (xpol), int16 and float32 samples,
  and 95.238, 96, 128, 192 and 256 kHz sample rates.
file_format: 1
